{% extends "portal_base.html" %}
{% block title %}My Profile{% endblock %}
{% block heading %}My Profile{% endblock %}
{% block subheading %}Keep your details up to date so organizations can reach you.{% endblock %}

{% block content %}
<section class="panel">
    <div class="section-heading"><h2>Personal Details</h2></div>

    <form method="POST" action="{{ url_for('profile') }}" class="grid-form">
        <input name="full_name" value="{{ p.full_name }}" placeholder="Full name" required>
        <input value="{{ p.email }}" disabled title="Email cannot be changed">
        <input type="tel" name="phone" value="{{ p.phone }}" placeholder="Phone number" required>
        <input name="availability" value="{{ p.availability or '' }}"
               placeholder="Availability, e.g. weekends">
        <textarea name="skills" placeholder="Your skills, e.g. teaching, first aid, coding">{{ p.skills or '' }}</textarea>
        <button type="submit">Save Changes</button>
    </form>
</section>
{% endblock %}
